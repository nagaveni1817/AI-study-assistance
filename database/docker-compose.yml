services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-study-assistance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_study_assistance
      POSTGRES_USER: ai_study_user
      POSTGRES_PASSWORD: ai_study_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_study_user -d ai_study_assistance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
